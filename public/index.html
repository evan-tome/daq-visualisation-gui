<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Visualisation of Measurements Taken From a DAQ System</title>
	<script src="https://bernii.github.io/gauge.js/dist/gauge.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
    	<h1>DAQ Measurement Readings</h1>
    </header>

	<p id="description">Placeholder</p>

    <div id="gaugeContainer">
        <div class="gaugeBlock">
        	<canvas id="gauge1"></canvas>
            <p id="label1">Temperature: 0.00 C</p>
        </div>

        <div class="gaugeBlock">
            <canvas id="gauge2"></canvas>
            <p id="label2">Voltage: 0.00 V</p>
        </div>

        <div class="gaugeBlock">
            <canvas id="gauge3"></canvas>
            <p id="label3">Measurement 3: 0.00</p>
        </div>
    </div>

    <p id="sensorStatus">Sensor Status: Checking...</p>

    <div class="port-selector-wrapper">
        <label for="portSelector">Select Port:</label>
        <select id="portSelector"></select>
    </div>

    <button id="connectBtn">Connect</button>

    <script>
        var socket = io("http://localhost:3000");

        // Fetch and populate available ports
        let currentPorts = [];

        function updatePortSelector() {
          fetch("/ports")
            .then(res => res.json())
            .then(ports => {
              const selector = document.getElementById("portSelector");

              // Save current selection
              const currentSelection = selector.value;

              // Clear existing options
              selector.innerHTML = "";

              if (ports.length === 0) {
                const option = document.createElement("option");
                option.disabled = true;
                option.textContent = "No ports available";
                selector.appendChild(option);
              } else {
                ports.forEach(port => {
                  const option = document.createElement("option");
                  option.value = port;
                  option.textContent = port;
                  selector.appendChild(option);
                });

                // Try to restore previous selection
                if (ports.includes(currentSelection)) {
                  selector.value = currentSelection;
                }
              }
            })
            .catch(err => {
              console.error("Error fetching ports:", err);
            });
        }

        // Initial and periodic refresh
        document.addEventListener("DOMContentLoaded", () => {
          updatePortSelector();
          setInterval(updatePortSelector, 3000); // check every 3 seconds
        });

        socket.on("connect", () => console.log("Socket connected"));
        socket.on("disconnect", () => console.log("Socket disconnected"));
        socket.on("connect_error", (err) => console.error("Connection error:", err));

        document.getElementById("connectBtn").addEventListener("click", () => {
          const selectedPort = document.getElementById("portSelector").value;
          socket.emit("createPort", selectedPort);
        });

        // Gauge options
        var opts = {
            angle: 0, // Set angle to 0
            lineWidth: 0.2,
            radiusScale: 1,
            limitMax: false,
            limitMin: false,
            highDpiSupport: true,
            staticLabels: {
                font: "10px sans-serif",
                labels: [0, 20, 40, 60, 80, 100],
                color: "#000000",
                fractionDigits: 0
            },
            pointer: {
                length: 0.6, // Relative to gauge radius
                strokeWidth: 0.025, // Thickness
                color: '#000000'
            },
            renderTicks: {
                divisions: 5,
                divWidth: 1,
                divLength: 0.7,
                divColor: '#666666',
                subDivisions: 4,
                subLength: 0.5,
                subWidth: 0.6,
                subColor: '#666666'
            },
        };

        // Initialize gauges
        var gauge1 = new Gauge(document.getElementById("gauge1")).setOptions(opts);
        gauge1.maxValue = 100;
        gauge1.set(0);

        var gauge2 = new Gauge(document.getElementById("gauge2")).setOptions(opts);
        gauge2.maxValue = 100;
        gauge2.set(50);

        var gauge3 = new Gauge(document.getElementById("gauge3")).setOptions(opts);
        gauge3.maxValue = 100;
        gauge3.set(15);
        gauge3.options

        var sensorStatus = document.getElementById("sensorStatus");

        // Listen for real-time DAQ data
        socket.on("daqData", (data) => {
            gauge1.set(data.temperature);
            gauge2.set(data.voltage);
            gauge3.set(data.measurement3);

            document.getElementById("label1").innerText = "Temperature: " + data.temperature + " C";
            document.getElementById("label2").innerText = "Voltage: " + data.voltage + " V";
            document.getElementById("label3").innerText = "Measurement 3: " + data.measurement3;

            // Update sensor status
            if (data.sensorConnected) {
                sensorStatus.innerText = "Sensor Status: Connected";
                sensorStatus.style.color = "green";
            } else {
                sensorStatus.innerText = "Sensor Status: Disconnected";
                sensorStatus.style.color = "red";
            }

            // Update connect button
            const button = document.getElementById("connectBtn");

            if (data.sensorConnected) {
                button.disabled = true;
                button.innerText = "Connected";
            } else {
                button.disabled = false;
                button.innerText = "Connect";
            }
        });
    </script>
</body>
<footer>
    <p>Placeholder</p>
</footer>
</html>
