<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Visualisation of Measurements Taken From a DAQ System</title>
	<script src="https://bernii.github.io/gauge.js/dist/gauge.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
    	<h1>DAQ Measurement Readings</h1>
    </header>

	<p id="description">Hello World!</p>

    <div id="gaugeContainer">
        <div class="gaugeBlock">
        	<canvas id="gauge1"></canvas>
            <p id="label1">Measurement1: 0</p>
        </div>

        <div class="gaugeBlock">
            <canvas id="gauge2"></canvas>
            <p id="label2">Measurement2: 0</p>
        </div>

        <div class="gaugeBlock">
            <canvas id="gauge3"></canvas>
            <p id="label3">Measurement3: 0</p>
        </div>
    </div>

    <script>
        var socket = io("http://localhost:3000");

        var opts = {
            angle: 0, // Set angle to 0
            lineWidth: 0.2,
            radiusScale: 1,
            limitMax: false,
            limitMin: false,
            staticLabels: {
                font: "10px sans-serif",  // Specifies font
                labels: [0, 20, 40, 60, 80, 100],  // Print labels at these values
                color: "#000000",  // Optional: Label text color
                fractionDigits: 0  // Optional: Numerical precision. 0=round off.
            },
            renderTicks: {
                divisions: 5,
                divWidth: 1,
                divLength: 0.7,
                divColor: '#115919',
                subDivisions: 4,
                subLength: 0.5,
                subWidth: 0.6,
                subColor: '#666666'
            }
        };

        // Initialize gauges
        var gauge1 = new Gauge(document.getElementById("gauge1")).setOptions(opts);
        gauge1.maxValue = 100;
        gauge1.set(0);

        var gauge2 = new Gauge(document.getElementById("gauge2")).setOptions(opts);
        gauge2.maxValue = 100;
        gauge2.set(50);

        var gauge3 = new Gauge(document.getElementById("gauge3")).setOptions(opts);
        gauge3.maxValue = 100;
        gauge3.set(15);
        gauge3.options

        // Listen for real-time DAQ data
        socket.on("daqData", (data) => {
            gauge1.set(data.measurement1);
            gauge2.set(data.measurement2);
            gauge3.set(data.measurement3);

            document.getElementById("label1").innerText = "Measurement1: " + data.measurement1.toFixed(2);
            document.getElementById("label2").innerText = "Measurement2: " + data.measurement2.toFixed(2);
            document.getElementById("label3").innerText = "Measurement3: " + data.measurement3.toFixed(2);
        });
    </script>
</body>
<footer>
    <p>Goodbye World!</p>
</footer>
</html>
